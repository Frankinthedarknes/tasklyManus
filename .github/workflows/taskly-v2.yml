name: Taskly 2.0

on:
  pull_request:
    paths:
      - 'taskly-v2/**'
      - '.github/workflows/taskly-v2.yml'
  push:
    branches:
      - 'taskly-2/**'
    paths:
      - 'taskly-v2/**'
      - '.github/workflows/taskly-v2.yml'

permissions:
  contents: read

jobs:
  accounts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskly-v2
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskly_test
          POSTGRES_PASSWORD: taskly_test
          POSTGRES_DB: taskly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: taskly-v2/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm test
        name: Test with PostgreSQL
        env:
          TASKLY_TEST_DATABASE_URL: postgresql://taskly_test:taskly_test@127.0.0.1:5432/taskly_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
